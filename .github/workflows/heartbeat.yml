name: Heartbeat

on:
  schedule:
    # Runs every 15 min across 02:00-04:59 UTC, which covers the
    # 21:30-22:45 Central send window under both CDT (UTC-5) and
    # CST (UTC-6). heartbeat.py's in_window() guard + heartbeat_log
    # dedup ensure only one email actually goes out per night.
    - cron: '*/15 2-4 * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Run heartbeat
        run: |
          python worker/heartbeat.py
