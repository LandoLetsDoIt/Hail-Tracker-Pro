name: Heartbeat

on:
  # GitHub's native `schedule` trigger is unreliable for this: it
  # silently dropped ~10 of 12 expected */15 firings overnight and
  # the 2 that did fire landed at arbitrary times outside the send
  # window. An external cron service now hits this via the Actions
  # API (POST .../actions/workflows/heartbeat.yml/dispatches) at a
  # precise, timezone-aware 10pm Central daily. See README for setup.
  workflow_dispatch:
    inputs:
      bypass_window:
        description: 'Bypass the time-window guard (manual testing only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      GITHUB_TOKEN: ${{ github.token }}
      HEARTBEAT_BYPASS_WINDOW: ${{ (inputs.bypass_window && '1') || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Run heartbeat
        run: |
          python worker/heartbeat.py
